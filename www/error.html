<!doctype html>
<!--
  Shown by the native shell (capacitor.config.ts → server.errorPath) when the remote app can't be
  reached. Without this, a failed load leaves Capacitor on the WebView's own dead error page with
  no reload affordance at all — the app looks permanently broken until it's force-stopped, which
  is exactly what a shop on patchy wifi hits first. Deliberately self-contained: no external CSS,
  fonts or scripts, since by definition the network is what just failed.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Fashion Flow</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f0eef8;
        color: #1c1a22;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .card { max-width: 340px; }
      .mark {
        width: 56px; height: 56px; margin: 0 auto 20px;
        border-radius: 16px; background: #6d28d9;
        display: flex; align-items: center; justify-content: center;
        color: #fff; font-size: 26px; font-weight: 600;
      }
      h1 { font-size: 19px; margin: 0 0 8px; }
      p { margin: 0 0 24px; color: #57536b; font-size: 14px; }
      button {
        width: 100%; padding: 13px 20px; border: 0; border-radius: 12px;
        background: #6d28d9; color: #fff; font-size: 15px; font-weight: 600;
        cursor: pointer; -webkit-tap-highlight-color: transparent;
      }
      button:active { opacity: 0.85; }
      .hint { margin: 14px 0 0; font-size: 12px; color: #78748c; }
      @media (prefers-color-scheme: dark) {
        body { background: #0a0a0a; color: #f4f3f7; }
        p { color: #a5a1b5; }
        .hint { color: #8a8699; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">FF</div>
      <h1>Can&rsquo;t reach Fashion Flow</h1>
      <p>You appear to be offline, or the connection dropped while loading. Your data is safe &mdash; nothing was lost.</p>
      <button type="button" id="retry">Try again</button>
      <p class="hint">If this keeps happening, check your Wi-Fi or mobile data.</p>
    </div>
    <script>
      document.getElementById("retry").addEventListener("click", function () {
        window.location.href = "https://app.fashionflow.app";
      });
    </script>
  </body>
</html>
